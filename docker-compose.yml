# Configuration comes from .env (see .env.example); the defaults suit local development.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qubdidb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qubdidb}
      POSTGRES_DB: ${POSTGRES_DB:-qubdidb}
    ports:
      - "${POSTGRES_BIND_IP:-0.0.0.0}:${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - qubdidb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qubdidb}:${POSTGRES_PASSWORD:-qubdidb}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-qubdidb}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      CONNECTION_KEY: ${CONNECTION_KEY:-}
      INTROSPECT_ALLOW_HOSTS: ${INTROSPECT_ALLOW_HOSTS:-}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "${SERVER_BIND_IP:-0.0.0.0}:${SERVER_PORT:-3001}:3001"

  ui:
    build:
      context: .
      args:
        VITE_HOST_URL: ${VITE_HOST_URL:-}
    environment:
      # read by the browser at run time through /config.js
      QUBDI_BACKEND_URL: ${QUBDI_BACKEND_URL:-http://localhost:3001}
    depends_on:
      - server
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:${UI_PORT:-8080}:80"

  # Optional: only needed to run the SQL Server introspection tests.
  #   docker compose --profile mssql up -d mssql
  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Qubdi_Strong_Pass1}
    ports:
      - "${MSSQL_BIND_IP:-127.0.0.1}:${MSSQL_PORT:-14333}:1433"

volumes:
  qubdidb-data:
