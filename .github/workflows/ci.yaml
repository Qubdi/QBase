name: CI

on:
  pull_request:
    branches: [main]
  # a direct push to main is checked too
  push:
    branches: [main]

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run pointless
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Editor (lint, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` lints again first; the Lint step above already did
      - name: Build
        run: npx tsc -b && npx vite build

      - name: Run tests
        run: npm run test:ci

  server:
    name: Server (lint, typecheck, build, test) on PostgreSQL ${{ matrix.postgres.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the README says PostgreSQL 16 or newer: the oldest supported major and the
    # one the bundled compose file runs both get the whole server suite
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - major: 16
            image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
          - major: 18
            image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    defaults:
      run:
        working-directory: server
    services:
      # the server tests expect this database on localhost:5433
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_USER: qbase
          POSTGRES_PASSWORD: qbase
          POSTGRES_DB: qbase
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qbase"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

  audit:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the secret scan reads the whole history
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # Fails on high and critical advisories in what ships.
      - name: Audit editor dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit server dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t qubdi/qbase:ci .

      # the image has to start, migrate and answer, not just build
      - name: Start the image with its database and check /api/health
        run: |
          docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait --wait-timeout 120
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8080/api/health
        env:
          # throwaway values for this run only
          POSTGRES_PASSWORD: ci-only-password
          CONNECTION_KEY: ci-only-connection-key-0123456789abcdef

      - name: Show the app log if the check failed
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml logs app
        env:
          POSTGRES_PASSWORD: ci-only-password
          CONNECTION_KEY: ci-only-connection-key-0123456789abcdef

      # the tests and the shipped database must be the same image
      - name: Check the database image is pinned the same everywhere
        run: .github/scripts/check-postgres-digest.sh
