name: CLA

# Asks each contributor to sign CLA.md once and records the signature in a
# separate repository.
on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  sign:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_PAT }}
        with:
          path-to-document: https://github.com/qubdi/qbase/blob/main/CLA.md
          remote-organization-name: qubdi
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          # must be an unprotected branch of the signatures repository
          branch: main
          # bots cannot sign; comma-separated GitHub logins
          allowlist: dependabot[bot]
