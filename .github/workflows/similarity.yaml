name: Upstream similarity

# Part of the clean-room rewrite (see rewrite/PLAN.md). This branch must contain
# only original code, so every file under src/, server/ and shared/ is checked,
# plus the files listed in rewrite/rewritten.txt. It fails when a file is identical
# to ChartDB, shares 30% or more of its lines, or has a run of more than 25
# identical lines.

on:
  pull_request:
    branches: [rewrite/clean-room]
  push:
    branches: [rewrite/clean-room]

permissions:
  contents: read

jobs:
  similarity:
    name: Shared code with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # Pinned to the commit the comparison was made against
      - name: Fetch upstream
        run: |
          git init upstream
          git -C upstream fetch --depth 1 https://github.com/chartdb/chartdb.git ee95448d154cfdcf65264c45745f440c0480ef84
          git -C upstream checkout FETCH_HEAD

      - name: Check every file against upstream
        run: >
          node tools/similarity.mjs --upstream upstream
          --src src --src server/src --src shared
          --check --all
          --rewritten rewrite/rewritten.txt --allow rewrite/similarity-allow.txt

      # The spec must describe behaviour, not contain ChartDB code
      - name: Check the behaviour spec
        run: node tools/spec-check.mjs --dir rewrite/spec --upstream upstream
