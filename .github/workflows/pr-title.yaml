name: PR title

# release-please builds the changelog and the next version from commit messages,
# and a squash-merged pull request becomes one commit with the PR title.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|test|build|ci|chore|refactor|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title must follow Conventional Commits, e.g. 'fix(server): reject empty names'. Got: $TITLE"
            exit 1
          fi
