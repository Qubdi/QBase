version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # keeps the pinned commit SHAs in the workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node moves a major at a time on purpose: the even (LTS) release only,
    # kept in step with .nvmrc, engines and CI
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    # Node moves a major at a time on purpose: the even (LTS) release only,
    # kept in step with .nvmrc, engines and CI
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # the compose file's images (Postgres, SQL Server) are pinned by digest too
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
