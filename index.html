<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>QBase - Database schema diagrams</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, max-image-preview:large" />
        <!-- the server writes this page's style nonce here (see web.ts) -->
        <meta name="csp-nonce" content="__CSP_NONCE__" />
        <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
        <!-- shows a notice instead of a blank page in browsers that are too old -->
        <script src="/browser-check.js"></script>
        <!-- runs before first paint so the saved theme does not flash -->
        <script src="/theme-init.js"></script>
        <!-- runtime settings, answered by the server itself at /config.js -->
        <script src="/config.js"></script>
    </head>
    <body>
        <main id="root">
            <!-- replaced when the app starts; shown only without JavaScript -->
            <noscript>
                <p>QBase needs JavaScript. Turn it on and reload the page.</p>
            </noscript>
        </main>
        <script src="/src/main.tsx" type="module"></script>
    </body>
</html>
